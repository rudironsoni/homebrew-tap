name: Update Horca channels

on:
  repository_dispatch:
    types: [horca-release-published]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to reconcile
        required: true
        type: choice
        options: [stable, beta, all]

permissions:
  contents: write

concurrency:
  group: horca-channel-update
  cancel-in-progress: false

jobs:
  channels:
    if: github.repository == 'rudironsoni/homebrew-tap'
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        channel: [stable, beta]
    steps:
      - name: Select requested channels
        id: requested
        env:
          CHANNEL: ${{ matrix.channel }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_CHANNEL: ${{ github.event.client_payload.channel }}
          MANUAL_CHANNEL: ${{ inputs.channel }}
        run: |
          selected=true
          if [ "$EVENT_NAME" = repository_dispatch ] && [ "$DISPATCH_CHANNEL" != "$CHANNEL" ]; then selected=false; fi
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$MANUAL_CHANNEL" != all ] && [ "$MANUAL_CHANNEL" != "$CHANNEL" ]; then selected=false; fi
          echo "selected=$selected" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps.requested.outputs.selected == 'true'
        with:
          ref: main
          fetch-depth: 0

      - id: homebrew
        if: steps.requested.outputs.selected == 'true'
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607
        with:
          core: false
          cask: false

      - name: Select newest release by version
        id: release
        if: steps.requested.outputs.selected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ matrix.channel }}
          REQUESTED_TAG: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.tag || '' }}
          REQUESTED_SHA: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.source_sha || '' }}
        run: node scripts/update-horca-channel.mjs select

      - name: Compare current cask
        id: current
        if: steps.release.outputs.found == 'true'
        env:
          CHANNEL: ${{ matrix.channel }}
          VERSION: ${{ steps.release.outputs.version }}
        run: node scripts/update-horca-channel.mjs compare

      - name: Download and verify release assets
        if: steps.current.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ matrix.channel }}
          TAG: ${{ steps.release.outputs.tag }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          mkdir -p artifacts
          gh release download "$TAG" --repo rudironsoni/orca --dir artifacts
          node scripts/update-horca-channel.mjs verify artifacts/horca-release.json artifacts

      - name: Render cask
        if: steps.current.outputs.changed == 'true'
        env:
          CHANNEL: ${{ matrix.channel }}
        run: node scripts/update-horca-channel.mjs render artifacts/horca-release.json

      - name: Validate tap
        if: steps.current.outputs.changed == 'true'
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
          TAP_NAME: ${{ steps.homebrew.outputs.tap-name }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          token=horca
          if [ "$CHANNEL" = beta ]; then token='horca@beta'; fi
          brew readall "$TAP_NAME"
          brew style --cask "$TAP_NAME/$token"
          brew audit --cask --online "$TAP_NAME/$token"
          brew install --cask "$TAP_NAME/$token"
          codesign --verify --deep --strict '/Applications/Horca.app'
          spctl --assess --type execute '/Applications/Horca.app'
          brew uninstall --cask "$TAP_NAME/$token"

      - name: Commit with remote lease
        if: steps.current.outputs.changed == 'true'
        env:
          CHANNEL: ${{ matrix.channel }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          token=horca
          if [ "$CHANNEL" = beta ]; then token='horca@beta'; fi
          git add "Casks/$token.rb"
          git commit -m "chore(horca): update $CHANNEL to $VERSION"
          remote_main=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$(git rev-parse HEAD^)" = "$remote_main"
          git push origin HEAD:main
