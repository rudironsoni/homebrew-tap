name: Bump humpback cask

# Pull-based cask automation: polls the latest Humpback release on
# rudironsoni/orca-builds and, when the cask is behind, downloads the DMGs,
# recomputes sha256, updates Casks/humpback.rb, runs brew style + audit, and
# commits with this repository's own GITHUB_TOKEN. No cross-repository write
# credentials anywhere: orca-builds never pushes here; this repo never writes
# elsewhere.

on:
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    # macOS runner: brew style/audit need a working Homebrew.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tap
        uses: actions/checkout@v6

      - name: Read latest Humpback release
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/rudironsoni/orca-builds/releases/latest --jq .tag_name 2>/dev/null) || {
            echo "::notice::no Humpback release published yet"
            echo "version=" >>"$GITHUB_OUTPUT"
            exit 0
          }
          if ! [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+-humpback\.[0-9]+)$ ]]; then
            echo "::error::latest release tag does not look like a Humpback tag: $tag"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >>"$GITHUB_OUTPUT"

      - name: Compare with the cask
        id: compare
        if: steps.latest.outputs.version != ''
        env:
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          set -euo pipefail
          current=$(sed -n 's/^  version "\(.*\)".*$/\1/p' Casks/humpback.rb | head -1)
          echo "cask version: $current, latest release: $VERSION"
          if [ "$current" = "$VERSION" ]; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Update cask
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          set -euo pipefail
          for arch in arm64 x64; do
            gh release download "v$VERSION" \
              --repo rudironsoni/orca-builds \
              --pattern "humpback-macos-$arch.dmg" \
              --dir /tmp/humpback-bump
          done
          sha_arm64=$(shasum -a 256 /tmp/humpback-bump/humpback-macos-arm64.dmg | cut -d' ' -f1)
          sha_x64=$(shasum -a 256 /tmp/humpback-bump/humpback-macos-x64.dmg | cut -d' ' -f1)

          # Replace version and the two sha256 values (arm line, then intel line).
          sed -i '' \
            -e "s|^  version \".*$|  version \"$VERSION\"|" \
            -e "s|^  sha256 arm:   \".*\",$|  sha256 arm:   \"$sha_arm64\",|" \
            -e "s|^         intel: \".*\"$|         intel: \"$sha_x64\"|" \
            Casks/humpback.rb

          grep -q "version \"$VERSION\"" Casks/humpback.rb
          grep -q "$sha_arm64" Casks/humpback.rb
          grep -q "$sha_x64" Casks/humpback.rb

      - name: Style and audit
        if: steps.compare.outputs.changed == 'true'
        run: |
          set -euo pipefail
          brew style --cask "$PWD/Casks/humpback.rb"
          brew audit --cask "$PWD/Casks/humpback.rb" || {
            echo "::warning::brew audit reported issues; review before relying on this bump"
            exit 1
          }

      - name: Commit and push
        if: steps.compare.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Casks/humpback.rb
          git commit -m "humpback $VERSION"
          git push
